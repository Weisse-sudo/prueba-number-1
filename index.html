<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Francesca</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; /* Fondo oscuro para que resalten las partículas */
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: white;
        }

        /* Canvas de partículas de fondo */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Contenedor de las páginas */
        #pages-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 80px); /* Deja espacio para los controles */
            z-index: 10;
        }

        /* Estructura base de cada página */
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            padding: 40px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        .page.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Contenedor del texto (sin cajas blancas, flotando libre) */
        .text-content {
            max-width: 500px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.8); /* Sombra para que se lea sobre las partículas */
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff4b72;
            font-size: clamp(40px, 6vw, 60px);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 75, 114, 0.6);
        }

        p {
            font-size: clamp(18px, 3vw, 24px);
            line-height: 1.6;
            font-weight: 600;
        }

        .reason-number {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(80px, 12vw, 150px);
            color: rgba(255, 255, 255, 0.1);
            position: absolute;
            z-index: -1;
            top: -20px;
            left: -20px;
        }

        /* ==========================================
           POSICIONES DINÁMICAS
           ========================================== */
        .pos-center { justify-content: center; align-items: center; text-align: center; }
        .pos-top-left { justify-content: flex-start; align-items: flex-start; text-align: left; }
        .pos-bottom-right { justify-content: flex-end; align-items: flex-end; text-align: right; }
        .pos-top-right { justify-content: flex-end; align-items: flex-start; text-align: right; }
        .pos-bottom-left { justify-content: flex-start; align-items: flex-end; text-align: left; }
        .pos-center-left { justify-content: flex-start; align-items: center; text-align: left; }
        .pos-center-right { justify-content: flex-end; align-items: center; text-align: right; }

        /* ==========================================
           ANIMACIONES CREATIVAS
           ========================================== */
        /* Explosión (Aparece de golpe desde pequeño) */
        .anim-explode { transform: scale(0.2); opacity: 0; }
        .active .anim-explode { animation: explodeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes explodeIn { to { transform: scale(1); opacity: 1; } }

        /* Caída lenta (Gravedad suave) */
        .anim-drop { transform: translateY(-100px); opacity: 0; }
        .active .anim-drop { animation: dropDown 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes dropDown { to { transform: translateY(0); opacity: 1; } }

        /* Deslizamiento desde los lados */
        .anim-slide-left { transform: translateX(-100px); opacity: 0; filter: blur(10px); }
        .active .anim-slide-left { animation: slideLeft 0.8s ease-out forwards; }
        @keyframes slideLeft { to { transform: translateX(0); opacity: 1; filter: blur(0); } }

        .anim-slide-right { transform: translateX(100px); opacity: 0; filter: blur(10px); }
        .active .anim-slide-right { animation: slideRight 0.8s ease-out forwards; }
        @keyframes slideRight { to { transform: translateX(0); opacity: 1; filter: blur(0); } }

        /* ==========================================
           CONTROLES
           ========================================== */
        .controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 20;
        }

        button {
            background: rgba(255, 75, 114, 0.2);
            color: #ff4b72;
            border: 1px solid #ff4b72;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        button:hover {
            background: #ff4b72;
            color: white;
            box-shadow: 0 0 15px rgba(255, 75, 114, 0.6);
        }

        button:disabled {
            border-color: #555;
            color: #555;
            background: transparent;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- El lienzo donde pintaremos el corazón de partículas basado en ecuaciones matemáticas -->
    <canvas id="particle-canvas"></canvas>

    <div id="pages-container"></div>

    <div class="controls">
        <button id="btn-prev" disabled>Atrás</button>
        <span id="page-counter" style="color: rgba(255,255,255,0.5); font-size: 14px; font-weight: bold;"></span>
        <button id="btn-next">Siguiente</button>
    </div>

    <script>
        // ==========================================
        // 1. MOTOR DE PARTÍCULAS (LA MAGIA DE LA IMAGEN TRADUCIDA)
        // ==========================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let time = 0;
        let isFocusMode = true; // Si es true, el corazón es grande y centrado (inicio y final)

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Fórmula matemática del corazón (Traducción de Python a JS)
        function getHeartPosition(t, scale) {
            // x = 16 * sin^3(t)
            const x = 16 * Math.pow(Math.sin(t), 3);
            // y = 13*cos(t) - 5*cos(2t) - 2*cos(3t) - cos(4t) (Invertido porque el canvas dibuja hacia abajo)
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x * scale, y: y * scale };
        }

        class Particle {
            constructor() {
                this.t = Math.random() * Math.PI * 2; // Punto aleatorio en la curva
                this.noiseX = (Math.random() - 0.5) * 20; // Dispersión
                this.noiseY = (Math.random() - 0.5) * 20;
                this.size = Math.random() * 2 + 0.5;
                this.color = Math.random() > 0.5 ? '#ff4b72' : '#ff8fa3';
                this.speed = Math.random() * 0.02 + 0.005;
            }

            draw(scaleMultiplier) {
                // Calcular posición base
                let pos = getHeartPosition(this.t, scaleMultiplier);
                
                // Añadir efecto de latido y rotación lenta
                const beat = Math.sin(time * 5) * 0.05 + 1;
                
                const finalX = width/2 + pos.x * beat + this.noiseX;
                const finalY = height/2 + pos.y * beat + this.noiseY;

                ctx.beginPath();
                ctx.arc(finalX, finalY, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Mover ligeramente por el perímetro
                this.t += this.speed;
            }
        }

        // Crear 600 partículas (un buen equilibrio para rendimiento en web)
        for(let i = 0; i < 600; i++) particles.push(new Particle());

        function animateCanvas() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; // Estela de movimiento
            ctx.fillRect(0, 0, width, height);
            
            // Si estamos en la página inicial o final, el corazón es más grande.
            // Si estamos leyendo las razones, se reduce y queda como fondo sutil.
            const targetScale = isFocusMode ? Math.min(width, height) / 45 : Math.min(width, height) / 90;
            
            particles.forEach(p => p.draw(targetScale));
            time += 0.02;
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // ==========================================
        // 2. TEXTOS, POSICIONES Y ANIMACIONES DINÁMICAS
        // ==========================================
        const razones = [
            "Tu carita y tu voz tienen el poder de iluminar hasta mi día mas gris.",
            "La forma tan linda en la que te apasionas por las cosas que te gustan.",
            "Tu sentido del humor y cómo siempre logras hacerme reír.",
            "Lo inteligente y brillante que eres en todo lo que haces.",
            "Lo esforzada que eres por las cosas en la u y como te gusta que todo quede como te gusta.",
            "Tu actitud y personalidad que te hacen ver alguien segura.",
            "Las conversaciones de horas que se sienten como si fueran minutos.",
            "La paz y libertad que siento cuando hablo contigo .",
            "Ese pequeño detalle tuyo de recordar cada cosa que digo que me gusta por muy insignificante que sea.",
            "Simplemente porque eres tú, y me he dado cuenta de que me encantas."
        ];

        // Opciones de diseño para aleatorizar
        const posiciones = ['pos-top-left', 'pos-bottom-right', 'pos-top-right', 'pos-bottom-left', 'pos-center-left', 'pos-center-right'];
        const animaciones = ['anim-explode', 'anim-drop', 'anim-slide-left', 'anim-slide-right'];

        const container = document.getElementById('pages-container');
        let paginasHTML = [];

        // Portada (Centrada y con explosión)
        paginasHTML.push(`
            <div class="page active pos-center">
                <div class="text-content anim-explode">
                    <h1>Para ti...</h1>
                    <p style="color: #ddd;">He estado pensando mucho últimamente, y quería hacer algo diferente.</p>
                    <p style="color: #ff4b72;">10 razones por las que me encantas.</p>
                </div>
            </div>
        `);

        // Generar páginas aleatorias para las razones
        razones.forEach((razon, index) => {
            const posRandom = posiciones[Math.floor(Math.random() * posiciones.length)];
            const animRandom = animaciones[Math.floor(Math.random() * animaciones.length)];
            
            paginasHTML.push(`
                <div class="page ${posRandom}">
                    <div class="text-content ${animRandom}">
                        <div class="reason-number">${index + 1}</div>
                        <h1>Razón #${index + 1}</h1>
                        <p>${razon}</p>
                    </div>
                </div>
            `);
        });

        // Página Final (Centrada y caída)
        paginasHTML.push(`
            <div class="page pos-center">
                <div class="text-content anim-drop">
                    <h1>La verdad hay más</h1>
                    <p style="color: #ddd;">Estas son solo 10, pero mi lista es infinita.</p>
                    <p style="color: #ff4b72; font-size: 28px;">UwU</p>
                </div>
            </div>
        `);

        container.innerHTML = paginasHTML.join('');
                // Página Final 
        paginasHTML.push(`
            <div class="page pos-center">
                <div class="text-content anim-drop">
                    <h1>Y lo ultimo</h1>
                    <p style="color: #ddd;">Se que era evidente que me atraías</p>
                    <p style="color: #ff4b72; font-size: 28px;">Pero queria expresarme para que entendieras lo mucho que siento hacia ti y aclarar mis sentimientos </p>
                </div>
            </div>
        `);

        container.innerHTML = paginasHTML.join('');

        // ==========================================
        // 3. LÓGICA DE NAVEGACIÓN
        // ==========================================
        const pages = document.querySelectorAll('.page');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const counter = document.getElementById('page-counter');
        
        let currentPage = 0;
        const totalPages = pages.length;

        function updatePages() {
            pages.forEach((page, index) => {
                if (index === currentPage) {
                    page.classList.add('active');
                } else {
                    page.classList.remove('active');
                }
            });

            // Lógica para agrandar/achicar el corazón del fondo
            isFocusMode = (currentPage === 0 || currentPage === totalPages - 1);

            btnPrev.disabled = currentPage === 0;
            btnNext.style.display = currentPage === totalPages - 1 ? 'none' : 'block';
            
            if (currentPage === 0) counter.innerText = "Inicio";
            else if (currentPage === totalPages - 1) counter.innerText = "Fin";
            else counter.innerText = `${currentPage} de 10`;
        }

        btnNext.addEventListener('click', () => {
            if (currentPage < totalPages - 1) {
                currentPage++;
                updatePages();
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                updatePages();
            }
        });

        updatePages();
    </script>
</body>
</html>
