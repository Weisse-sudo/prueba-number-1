<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti... 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: white;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #pages-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 80px);
            z-index: 10;
            pointer-events: none;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            padding: 40px;
            box-sizing: border-box;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .text-content {
            max-width: 500px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.9);
            background: rgba(0, 0, 0, 0.65);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            transform: translateY(20px);
            transition: transform 0.4s ease-in-out;
        }

        .page.active .text-content {
            transform: translateY(0);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff4b72;
            font-size: clamp(40px, 6vw, 60px);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 75, 114, 0.6);
        }

        p {
            font-size: clamp(16px, 3vw, 22px);
            line-height: 1.6;
            font-weight: 600;
        }

        .reason-number {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(60px, 10vw, 120px);
            color: rgba(255, 75, 114, 0.2);
            position: absolute;
            z-index: -1;
            top: -20px;
            left: 10px;
        }

        /* Posiciones dinámicas */
        .pos-center { justify-content: center; align-items: center; text-align: center; }
        .pos-top-left { justify-content: flex-start; align-items: flex-start; text-align: left; }
        .pos-bottom-right { justify-content: flex-end; align-items: flex-end; text-align: right; }
        .pos-top-right { justify-content: flex-end; align-items: flex-start; text-align: right; }
        .pos-bottom-left { justify-content: flex-start; align-items: flex-end; text-align: left; }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 20;
        }

        button {
            background: rgba(255, 75, 114, 0.2);
            color: #ff4b72;
            border: 1px solid #ff4b72;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        button:hover { background: #ff4b72; color: white; box-shadow: 0 0 15px rgba(255, 75, 114, 0.6); }
        button:disabled { border-color: #444; color: #444; background: transparent; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div id="pages-container"></div>

    <div class="controls">
        <button id="btn-prev" type="button">Atrás</button>
        <span id="page-counter" style="color: rgba(255,255,255,0.6); font-size: 14px; font-weight: bold;"></span>
        <button id="btn-next" type="button">Siguiente</button>
    </div>

    <script>
        const razones = [
            "Tu sonrisa tiene el poder de iluminar hasta mi día más gris.",
            "La forma tan linda en la que te apasionas por las cosas que te gustan.",
            "Tu sentido del humor y cómo siempre logras hacerme reír.",
            "Lo inteligente y brillante que eres en todo lo que haces.",
            "Esa mirada especial que tienes y que me deja sin palabras.",
            "Tu infinita bondad y la forma tan dulce en la que tratas a los demás.",
            "Las conversaciones de horas que se sienten como si fueran minutos.",
            "La paz y seguridad que me haces sentir cuando estoy contigo.",
            "Ese pequeño detalle tuyo de [escribe aquí un detalle muy suyo].",
            "Simplemente porque eres tú, y me he dado cuenta de que me encantas."
        ];

        const container = document.getElementById('pages-container');
        let paginasHTML = [];
        const posiciones = ['pos-top-left', 'pos-bottom-right', 'pos-top-right', 'pos-bottom-left'];

        // Página 0: Inicio
        paginasHTML.push(`
            <div class="page active pos-center">
                <div class="text-content">
                    <h1>Para ti...</h1>
                    <p style="color: #ddd;">He estado pensando mucho últimamente, y quería hacer algo diferente.</p>
                    <p style="color: #ff4b72;">10 razones por las que me encantas.</p>
                </div>
            </div>
        `);

        // Páginas 1 a 10: Razones
        razones.forEach((razon, index) => {
            const pos = posiciones[index % posiciones.length];
            paginasHTML.push(`
                <div class="page ${pos}">
                    <div class="text-content">
                        <div class="reason-number">${index + 1}</div>
                        <h1>Razón #${index + 1}</h1>
                        <p>${razon}</p>
                    </div>
                </div>
            `);
        });

        // Página Final: Pregunta
        paginasHTML.push(`
            <div class="page pos-center">
                <div class="text-content">
                    <h1>¿Y bien?</h1>
                    <p style="color: #ddd;">Estas son solo 10, pero mi lista es infinita.</p>
                    <p style="color: #ff4b72; font-size: 28px;">¿Te gustaría salir conmigo?</p>
                </div>
            </div>
        `);
        
        container.innerHTML = paginasHTML.join('');

        // Configuración del canvas y partículas
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        let particles = [];
        const numParticles = 3500;
        let time = 0;
        let animationState = 'heart'; 
        let targets = { heart: [], rose: [], bird: [] };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateFormations();
        }
        window.addEventListener('resize', resize);

        function generateFormations() {
            // Corazón
            targets.heart = [];
            for (let i = 0; i < numParticles; i++) {
                let t = Math.random() * Math.PI * 2;
                targets.heart.push({
                    x: 16 * Math.pow(Math.sin(t), 3),
                    y: -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)),
                    z: (Math.random() - 0.5) * 10,
                    color: i % 2 === 0 ? '#ff4b72' : '#ff8fa3',
                    tParam: t
                });
            }

            // Rosa 3D
            targets.rose = [];
            for (let i = 0; i < numParticles; i++) {
                let u = (i / numParticles) * Math.PI * 12;
                let r = Math.sin(u * 0.7) * 15 + (i / numParticles) * 10;
                let x = r * Math.cos(u);
                let y = r * Math.sin(u);
                let z = -Math.sqrt(Math.max(0, 400 - (x*x + y*y))) + 10 + (Math.random() - 0.5) * 4;
                let col = i < numParticles * 0.2 ? '#2e8b57' : (Math.random() > 0.3 ? '#e60026' : '#ff4d6d');
                targets.rose.push({ x: x * 1.5, y: y * 1.5 - 20, z: z * 1.5, color: col });
            }

            // Ave
            targets.bird = [];
            for (let i = 0; i < numParticles; i++) {
                let pType = Math.random();
                let x = 0, y = 0, z = 0;
                if (pType < 0.45) {
                    let t = Math.random();
                    x = -t * 60 - 5; y = -Math.pow(t, 0.7) * 50 + (Math.random() - 0.5) * 6; z = (Math.random() - 0.5) * 5;
                } else if (pType < 0.90) {
                    let t = Math.random();
                    x = t * 60 + 5; y = -Math.pow(t, 0.7) * 50 + (Math.random() - 0.5) * 6; z = (Math.random() - 0.5) * 5;
                } else if (pType < 0.97) {
                    let t = (Math.random() - 0.5) * 40;
                    x = (Math.random() - 0.5) * 10; y = t; z = (Math.random() - 0.5) * 10;
                } else {
                    let t = Math.random();
                    x = (Math.random() - 0.5) * t * 15; y = t * 50 + 15; z = (Math.random() - 0.5) * 4;
                }
                targets.bird.push({ x: x, y: y, z: z, color: '#e0e0e0' });
            }
        }

        class Particle {
            constructor(index) {
                this.index = index;
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.z = 0;
                this.size = Math.random() * 1.5 + 0.8;
            }

            updateAndDraw() {
                let targetList = targets[animationState];
                if (!targetList || !targetList[this.index]) return;
                
                let target = targetList[this.index];
                let tx = target.x, ty = target.y, tz = target.z;
                let finalX = 0, finalY = 0;

                if (animationState === 'heart') {
                    let scale = (currentPage === 0 || currentPage === totalPages - 1) ? Math.min(width, height) / 45 : Math.min(width, height) / 100;
                    let beat = Math.sin(time * 5) * 0.05 + 1;
                    target.tParam += 0.02;
                    tx = 16 * Math.pow(Math.sin(target.tParam), 3);
                    ty = -(13 * Math.cos(target.tParam) - 5 * Math.cos(2*target.tParam) - 2 * Math.cos(3*target.tParam) - Math.cos(4*target.tParam));
                    finalX = width / 2 + (tx * scale * beat);
                    finalY = height / 2 + (ty * scale * beat);
                } else if (animationState === 'rose') {
                    let scale = Math.min(width, height) / 25;
                    let rotY = time * 0.6, rotX = 0.4;
                    let x1 = tx * Math.cos(rotY) - tz * Math.sin(rotY);
                    let z1 = tx * Math.sin(rotY) + tz * Math.cos(rotY);
                    let y2 = ty * Math.cos(rotX) - z1 * Math.sin(rotX);
                    let z2 = ty * Math.sin(rotX) + z1 * Math.cos(rotX);
                    let fov = 350, proj = fov / (fov + z2);
                    finalX = width / 2 + (x1 * scale * proj);
                    finalY = height / 2 + (y2 * scale * proj);
                } else if (animationState === 'bird') {
                    let scale = Math.min(width, height) / 35;
                    finalX = width / 2 + (tx * scale);
                    finalY = height / 2 + (ty * scale) - 20;
                }

                this.x += (finalX - this.x) * 0.08;
                this.y += (finalY - this.y) * 0.08;

                ctx.fillStyle = target.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        resize();
        for (let i = 0; i < numParticles; i++) particles.push(new Particle(i));

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, width, height);
            particles.forEach(p => p.updateAndDraw());
            time += 0.02;
            requestAnimationFrame(animate);
        }
        animate();

        // Control de navegación robusto
        let currentPage = 0;
        const pages = document.querySelectorAll('.page');
        const totalPages = pages.length;
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const counter = document.getElementById('page-counter');

        function updatePages() {
            pages.forEach((page, index) => {
                if (index === currentPage) {
                    page.classList.add('active');
                } else {
                    page.classList.remove('active');
                }
            });

            if (currentPage >= 3 && currentPage <= 5) {
                animationState = 'rose';
            } else if (currentPage >= 6 && currentPage <= 8) {
                animationState = 'bird';
            } else {
                animationState = 'heart';
            }

            btnPrev.disabled = (currentPage === 0);
            btnNext.innerText = (currentPage === totalPages - 1) ? "¡Listo!" : "Siguiente";
            
            if (currentPage === 0) counter.innerText = "Inicio";
            else if (currentPage === totalPages - 1) counter.innerText = "Final";
            else counter.innerText = `${currentPage} de ${totalPages - 2}`;
        }

        btnNext.onclick = function() {
            if (currentPage < totalPages - 1) {
                currentPage++;
                updatePages();
            }
        };

        btnPrev.onclick = function() {
            if (currentPage > 0) {
                currentPage--;
                updatePages();
            }
        };

        updatePages();
    </script>
</body>
</html>
