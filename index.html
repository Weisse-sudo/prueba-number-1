<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Francesca</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #080808; 
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: white;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #pages-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 80px);
            z-index: 10;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            padding: 40px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        .page.active {
            opacity: 1;
            pointer-events: all;
        }

        .text-content {
            max-width: 500px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.9);
            background: rgba(0, 0, 0, 0.4);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff4b72;
            font-size: clamp(40px, 6vw, 60px);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 75, 114, 0.6);
        }

        p {
            font-size: clamp(16px, 3vw, 22px);
            line-height: 1.6;
            font-weight: 600;
        }

        .reason-number {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(60px, 10vw, 120px);
            color: rgba(255, 75, 114, 0.2);
            position: absolute;
            z-index: -1;
            top: -10px;
            left: 10px;
        }

        /* Posiciones */
        .pos-center { justify-content: center; align-items: center; text-align: center; }
        .pos-top-left { justify-content: flex-start; align-items: flex-start; text-align: left; }
        .pos-bottom-right { justify-content: flex-end; align-items: flex-end; text-align: right; }
        .pos-top-right { justify-content: flex-end; align-items: flex-start; text-align: right; }
        .pos-bottom-left { justify-content: flex-start; align-items: flex-end; text-align: left; }
        
        /* Animaciones */
        .anim-explode { transform: scale(0.2); opacity: 0; }
        .active .anim-explode { animation: explodeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes explodeIn { to { transform: scale(1); opacity: 1; } }

        .anim-drop { transform: translateY(-100px); opacity: 0; }
        .active .anim-drop { animation: dropDown 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes dropDown { to { transform: translateY(0); opacity: 1; } }

        .anim-slide-left { transform: translateX(-100px); opacity: 0; filter: blur(10px); }
        .active .anim-slide-left { animation: slideLeft 0.8s ease-out forwards; }
        @keyframes slideLeft { to { transform: translateX(0); opacity: 1; filter: blur(0); } }

        .controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 20;
        }

        button {
            background: rgba(255, 75, 114, 0.2);
            color: #ff4b72;
            border: 1px solid #ff4b72;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        button:hover { background: #ff4b72; color: white; box-shadow: 0 0 15px rgba(255, 75, 114, 0.6); }
        button:disabled { border-color: #555; color: #555; background: transparent; cursor: not-allowed; }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div id="pages-container"></div>

    <div class="controls">
        <button id="btn-prev" disabled>Atrás</button>
        <span id="page-counter" style="color: rgba(255,255,255,0.5); font-size: 14px; font-weight: bold;"></span>
        <button id="btn-next">Siguiente</button>
    </div>

    <script>
        // ==========================================
        // MOTOR GRÁFICO MUTABLE (Corazón -> Rosa 3D -> Ave)
        // ==========================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let time = 0;
        let animationState = 'heart'; // 'heart', 'rose', 'bird'
        let isFocusMode = true; 

        // Variables interactivas del ave
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let birdPosX = window.innerWidth / 2;
        let birdPosY = window.innerHeight / 2;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            mouseX = width / 2; mouseY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Rastrear cursor o dedo para el ave
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('touchmove', (e) => { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; });

        class Particle {
            constructor(i, total) {
                this.i = i;
                this.total = total;
                this.x = width / 2;
                this.y = height / 2;

                // Parámetros Corazón
                this.tHeart = Math.random() * Math.PI * 2;
                this.noiseX = (Math.random() - 0.5) * 15;
                this.noiseY = (Math.random() - 0.5) * 15;

                // Parámetros Rosa 3D (u = 0 a 8PI)
                this.uRose = Math.random() * 8 * Math.PI;
                this.roseJitter = { x: (Math.random()-0.5)*3, y: (Math.random()-0.5)*3, z: (Math.random()-0.5)*3 };

                // Parámetros Ave
                if (i < total * 0.4) this.birdPart = 'body';
                else if (i < total * 0.7) this.birdPart = 'wingL';
                else this.birdPart = 'wingR';

                let rSize = this.birdPart === 'body' ? 15 : 8;
                let phi = Math.random() * Math.PI * 2;
                let costheta = Math.random() * 2 - 1;
                let theta = Math.acos(costheta);

                let bx = rSize * Math.sin(theta) * Math.cos(phi);
                let by = rSize * Math.sin(theta) * Math.sin(phi);
                
                if (this.birdPart === 'wingL') { bx -= 25; by += 5; }
                if (this.birdPart === 'wingR') { bx += 25; by += 5; }
                
                this.birdBaseX = bx;
                this.birdBaseY = by;
            }

            draw() {
                let targetX, targetY, targetColor, targetSize;

                if (animationState === 'heart') {
                    let scale = isFocusMode ? Math.min(width, height) / 45 : Math.min(width, height) / 90;
                    let hx = 16 * Math.pow(Math.sin(this.tHeart), 3);
                    let hy = -(13 * Math.cos(this.tHeart) - 5 * Math.cos(2*this.tHeart) - 2 * Math.cos(3*this.tHeart) - Math.cos(4*this.tHeart));
                    let beat = Math.sin(time * 5) * 0.05 + 1;

                    targetX = width/2 + hx * scale * beat + this.noiseX;
                    targetY = height/2 + hy * scale * beat + this.noiseY;
                    targetColor = this.i % 2 === 0 ? '#ff4b72' : '#ff8fa3';
                    targetSize = 1.5;
                    this.tHeart += 0.015;

                } else if (animationState === 'rose') {
                    let u = this.uRose;
                    let scale = Math.min(width, height) / 45; // Escala adaptativa
                    let r = scale * (Math.sin(2 * u + time * 0.5) * 0.5 + 0.5) * (Math.cos(3 * u + time * 0.2) * 0.5 + 0.5);

                    let rx = r * Math.cos(u) + this.roseJitter.x;
                    let ry = r * Math.sin(u) + this.roseJitter.y;
                    let rz = 2 * u + 5 * (Math.sin(u * 5) * 0.5 + 0.5) - 15 + this.roseJitter.z;

                    // Rotación 3D
                    let rotY = time * 0.3;
                    let rotX = 0.6; 
                    
                    let x1 = rx * Math.cos(rotY) - rz * Math.sin(rotY);
                    let z1 = rx * Math.sin(rotY) + rz * Math.cos(rotY);
                    
                    let y2 = ry * Math.cos(rotX) - z1 * Math.sin(rotX);
                    let z2 = ry * Math.sin(rotX) + z1 * Math.cos(rotX);

                    let fov = 150;
                    let proj = fov / (fov + z2 + 50);

                    targetX = width/2 + x1 * proj * 10;
                    targetY = height/2 + y2 * proj * 10 + 50;

                    let zNorm = u / (8 * Math.PI); 
                    let rCol = Math.floor(Math.min(zNorm * 2, 1) * 255);
                    let gCol = Math.floor(Math.max(0.6 - zNorm * 0.5, 0) * 255);
                    let bCol = Math.floor((Math.sin(zNorm * Math.PI) * 0.2) * 255);
                    
                    targetColor = `rgba(${rCol}, ${gCol}, ${bCol}, 0.8)`;
                    targetSize = Math.max(proj * 2.5, 0.5);

                } else if (animationState === 'bird') {
                    let aleteo = Math.sin(time * 10) * 15;
                    let bx = this.birdBaseX;
                    let by = this.birdBaseY;

                    if (this.birdPart === 'wingL') {
                        bx -= Math.abs(aleteo) * 0.5;
                        by += aleteo;
                    } else if (this.birdPart === 'wingR') {
                        bx += Math.abs(aleteo) * 0.5;
                        by += aleteo;
                    }

                    targetX = birdPosX + bx;
                    targetY = birdPosY + by;
                    
                    targetColor = this.birdPart === 'body' ? 'rgba(255, 215, 0, 0.9)' : 'rgba(255, 100, 0, 0.7)';
                    targetSize = 2;
                }

                // Interpolación lineal (LERP) para transiciones súper suaves entre estados
                this.x += (targetX - this.x) * 0.08;
                this.y += (targetY - this.y) * 0.08;

                ctx.fillStyle = targetColor;
                ctx.beginPath();
                ctx.arc(this.x, this.y, targetSize, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 3000 partículas para renderizado web óptimo sin saturar el CPU
        for(let i = 0; i < 3000; i++) particles.push(new Particle(i, 3000));

        function animateCanvas() {
            ctx.fillStyle = 'rgba(8, 8, 8, 0.3)'; 
            ctx.fillRect(0, 0, width, height);
            
            // Suavizado del movimiento del ave hacia el ratón
            birdPosX += (mouseX - birdPosX) * 0.05;
            birdPosY += (mouseY - birdPosY) * 0.05;

            particles.forEach(p => p.draw());
            time += 0.02;
            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // ==========================================
        // TEXTOS Y LÓGICA DE PÁGINAS
        // ==========================================
        const razones = [
            "Tu sonrisa tiene el poder de iluminar hasta mi día más gris.",
            "La forma tan linda en la que te apasionas por las cosas que te gustan.",
            "Tu sentido del humor y cómo siempre logras hacerme reír.",
            "Lo inteligente y brillante que eres en todo lo que haces.",
            "Esa mirada especial que tienes y que me deja sin palabras.",
            "Tu infinita bondad y la forma tan dulce en la que tratas a los demás.",
            "Las conversaciones de horas que se sienten como si fueran minutos.",
            "La paz y seguridad que me haces sentir cuando estoy contigo.",
            "Ese pequeño detalle tuyo de [escribe aquí un detalle muy suyo].",
            "Simplemente porque eres tú, y me he dado cuenta de que me encantas."
        ];

        const posiciones = ['pos-top-left', 'pos-bottom-right', 'pos-top-right', 'pos-bottom-left'];
        const animaciones = ['anim-explode', 'anim-drop', 'anim-slide-left'];

        const container = document.getElementById('pages-container');
        let paginasHTML = [];

        paginasHTML.push(`
            <div class="page active pos-center">
                <div class="text-content anim-explode">
                    <h1>Para ti...</h1>
                    <p style="color: #ddd;">He estado pensando mucho últimamente, y quería hacer algo diferente.</p>
                    <p style="color: #ff4b72;">10 razones por las que me encantas.</p>
                </div>
            </div>
        `);

        razones.forEach((razon, index) => {
            const posRandom = posiciones[Math.floor(Math.random() * posiciones.length)];
            const animRandom = animaciones[Math.floor(Math.random() * animaciones.length)];
            paginasHTML.push(`
                <div class="page ${posRandom}">
                    <div class="text-content ${animRandom}">
                        <div class="reason-number">${index + 1}</div>
                        <h1>Razón #${index + 1}</h1>
                        <p>${razon}</p>
                    </div>
                </div>
            `);
        });

        paginasHTML.push(`
            <div class="page pos-center">
                <div class="text-content anim-drop">
                    <h1>¿Y bien?</h1>
                    <p style="color: #ddd;">Estas son solo 10, pero mi lista es infinita.</p>
                    <p style="color: #ff4b72; font-size: 28px;">¿Te gustaría salir conmigo?</p>
                </div>
            </div>
        `);

        container.innerHTML = paginasHTML.join('');

        const pages = document.querySelectorAll('.page');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const counter = document.getElementById('page-counter');
        
        let currentPage = 0;
        const totalPages = pages.length;

        function updatePages() {
            pages.forEach((page, index) => {
                if (index === currentPage) page.classList.add('active');
                else page.classList.remove('active');
            });

            // Lógica de cambio de animación en el fondo
            isFocusMode = (currentPage === 0 || currentPage === totalPages - 1);
            
            if (currentPage >= 3 && currentPage <= 5) {
                animationState = 'rose';
            } else if (currentPage >= 6 && currentPage <= 8) {
                animationState = 'bird';
            } else {
                animationState = 'heart';
            }

            btnPrev.disabled = currentPage === 0;
            btnNext.style.display = currentPage === totalPages - 1 ? 'none' : 'block';
            
            if (currentPage === 0) counter.innerText = "Inicio";
            else if (currentPage === totalPages - 1) counter.innerText = "Fin";
            else counter.innerText = `${currentPage} de 10`;
        }

        btnNext.addEventListener('click', () => { if (currentPage < totalPages - 1) { currentPage++; updatePages(); } });
        btnPrev.addEventListener('click', () => { if (currentPage > 0) { currentPage--; updatePages(); } });
        updatePages();
    </script>
</body>
</html>
