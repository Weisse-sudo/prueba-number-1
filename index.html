<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Francesca</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            color: white;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #pages-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 80px);
            z-index: 10;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            padding: 40px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        .page.active {
            opacity: 1;
            pointer-events: all;
        }

        .text-content {
            max-width: 500px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.9);
            background: rgba(0, 0, 0, 0.5);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff4b72;
            font-size: clamp(40px, 6vw, 60px);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 75, 114, 0.6);
        }

        p {
            font-size: clamp(16px, 3vw, 22px);
            line-height: 1.6;
            font-weight: 600;
        }

        .reason-number {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(60px, 10vw, 120px);
            color: rgba(255, 75, 114, 0.2);
            position: absolute;
            z-index: -1;
            top: -10px;
            left: 10px;
        }

        /* Posiciones */
        .pos-center { justify-content: center; align-items: center; text-align: center; }
        .pos-top-left { justify-content: flex-start; align-items: flex-start; text-align: left; }
        .pos-bottom-right { justify-content: flex-end; align-items: flex-end; text-align: right; }
        .pos-top-right { justify-content: flex-end; align-items: flex-start; text-align: right; }
        .pos-bottom-left { justify-content: flex-start; align-items: flex-end; text-align: left; }
        
        /* Animaciones */
        .anim-explode { transform: scale(0.2); opacity: 0; }
        .active .anim-explode { animation: explodeIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes explodeIn { to { transform: scale(1); opacity: 1; } }

        .anim-drop { transform: translateY(-100px); opacity: 0; }
        .active .anim-drop { animation: dropDown 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes dropDown { to { transform: translateY(0); opacity: 1; } }

        .anim-slide-left { transform: translateX(-100px); opacity: 0; filter: blur(10px); }
        .active .anim-slide-left { animation: slideLeft 0.8s ease-out forwards; }
        @keyframes slideLeft { to { transform: translateX(0); opacity: 1; filter: blur(0); } }

        .controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 20;
        }

        button {
            background: rgba(255, 75, 114, 0.2);
            color: #ff4b72;
            border: 1px solid #ff4b72;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        button:hover { background: #ff4b72; color: white; box-shadow: 0 0 15px rgba(255, 75, 114, 0.6); }
        button:disabled { border-color: #555; color: #555; background: transparent; cursor: not-allowed; }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div id="pages-container"></div>

    <div class="controls">
        <button id="btn-prev" disabled>Atrás</button>
        <span id="page-counter" style="color: rgba(255,255,255,0.5); font-size: 14px; font-weight: bold;"></span>
        <button id="btn-next">Siguiente</button>
    </div>

    <script>
        // ==========================================
        // TEXTOS Y PÁGINAS DINÁMICAS
        // ==========================================
        const razones = [
            "Tu sonrisa tiene el poder de iluminar hasta mi día más gris.",
            "La forma tan linda en la que te apasionas por las cosas que te gustan.",
            "Tu sentido del humor y cómo siempre logras hacerme reír.",
            "Lo inteligente y brillante que eres en todo lo que haces.",
            "Esa mirada especial que tienes y que me deja sin palabras.",
            "Tu infinita bondad y la forma tan dulce en la que tratas a los demás.",
            "Las conversaciones de horas que se sienten como si fueran minutos.",
            "La paz y seguridad que me haces sentir cuando estoy contigo.",
            "Ese pequeño detalle tuyo de [escribe aquí un detalle muy suyo].",
            "Simplemente porque eres tú, y me he dado cuenta de que me encantas."
        ];

        const container = document.getElementById('pages-container');
        let paginasHTML = [];
        const posiciones = ['pos-top-left', 'pos-bottom-right', 'pos-top-right', 'pos-bottom-left'];
        const animaciones = ['anim-explode', 'anim-drop', 'anim-slide-left'];

        paginasHTML.push(`
            <div class="page active pos-center">
                <div class="text-content anim-explode">
                    <h1>Para ti...</h1>
                    <p style="color: #ddd;">He estado pensando mucho últimamente, y quería hacer algo diferente.</p>
                    <p style="color: #ff4b72;">10 razones por las que me encantas.</p>
                </div>
            </div>
        `);

        razones.forEach((razon, index) => {
            const posRandom = posiciones[Math.floor(Math.random() * posiciones.length)];
            const animRandom = animaciones[Math.floor(Math.random() * animaciones.length)];
            paginasHTML.push(`
                <div class="page ${posRandom}">
                    <div class="text-content ${animRandom}">
                        <div class="reason-number">${index + 1}</div>
                        <h1>Razón #${index + 1}</h1>
                        <p>${razon}</p>
                    </div>
                </div>
            `);
        });

        paginasHTML.push(`
            <div class="page pos-center">
                <div class="text-content anim-drop">
                    <h1>¿Y bien?</h1>
                    <p style="color: #ddd;">Estas son solo 10, pero mi lista es infinita.</p>
                    <p style="color: #ff4b72; font-size: 28px;">¿Te gustaría salir conmigo?</p>
                </div>
            </div>
        `);
        container.innerHTML = paginasHTML.join('');

        // ==========================================
        // MOTOR DE PARTÍCULAS PROCEDURAL Y 3D
        // ==========================================
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        let particles = [];
        const numParticles = 3500;
        let time = 0;
        let animationState = 'heart'; // 'heart', 'rose', 'bird'
        
        let targets = { heart: [], rose: [], bird: [] };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateFormations();
        }
        window.addEventListener('resize', resize);

        // Generar geometrías matemáticas puestas por código (Sin requerir imágenes externas)
        function generateFormations() {
            // 1. CORAZÓN
            targets.heart = [];
            for (let i = 0; i < numParticles; i++) {
                let t = Math.random() * Math.PI * 2;
                targets.heart.push({
                    x: 16 * Math.pow(Math.sin(t), 3),
                    y: -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)),
                    z: (Math.random() - 0.5) * 10,
                    color: i % 2 === 0 ? '#ff4b72' : '#ff8fa3',
                    tParam: t
                });
            }

            // 2. ROSA EN 3D (Estructura paramétrica en espiral con cúpula)
            targets.rose = [];
            for (let i = 0; i < numParticles; i++) {
                let u = (i / numParticles) * Math.PI * 12; // Vueltas de los pétalos
                let r = Math.sin(u * 0.7) * 15 + (i / numParticles) * 10;
                
                let x = r * Math.cos(u);
                let y = r * Math.sin(u);
                // Forma de copa/cúpula tridimensional para el centro de la rosa
                let z = -Math.sqrt(Math.max(0, 400 - (x*x + y*y))) + 10 + (Math.random() - 0.5) * 4;

                // Color dinámico: rojo intenso en los pétalos superiores, tallo/hojas verdosas abajo
                let col = i < numParticles * 0.2 ? '#2e8b57' : (Math.random() > 0.3 ? '#e60026' : '#ff4d6d');

                targets.rose.push({ x: x * 1.5, y: y * 1.5 - 20, z: z * 1.5, color: col });
            }

            // 3. AVE ESTÉTICA (Silueta con alas extendidas, cuerpo y cola)
            targets.bird = [];
            for (let i = 0; i < numParticles; i++) {
                let partType = Math.random();
                let x = 0, y = 0, z = 0;

                if (partType < 0.45) {
                    // Ala Izquierda
                    let t = Math.random();
                    x = -t * 60 - 5;
                    y = -Math.pow(t, 0.7) * 50 + (Math.random() - 0.5) * 6;
                    z = (Math.random() - 0.5) * 5;
                } else if (partType < 0.90) {
                    // Ala Derecha (Simétrica)
                    let t = Math.random();
                    x = t * 60 + 5;
                    y = -Math.pow(t, 0.7) * 50 + (Math.random() - 0.5) * 6;
                    z = (Math.random() - 0.5) * 5;
                } else if (partType < 0.97) {
                    // Cuerpo y Cabeza
                    let t = (Math.random() - 0.5) * 40;
                    x = (Math.random() - 0.5) * 10;
                    y = t;
                    z = (Math.random() - 0.5) * 10;
                } else {
                    // Cola larga
                    let t = Math.random();
                    x = (Math.random() - 0.5) * t * 15;
                    y = t * 50 + 15;
                    z = (Math.random() - 0.5) * 4;
                }

                targets.bird.push({
                    x: x, y: y, z: z,
                    color: '#e0e0e0'
                });
            }
        }

        class Particle {
            constructor(index) {
                this.index = index;
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.z = 0;
                this.size = Math.random() * 1.5 + 0.8;
            }

            updateAndDraw() {
                let targetList = targets[animationState];
                if (!targetList || targetList.length === 0) return;
                
                let target = targetList[this.index];
                let tx = target.x;
                let ty = target.y;
                let tz = target.z;
                
                let finalX = 0;
                let finalY = 0;

                if (animationState === 'heart') {
                    let scale = (currentPage === 0 || currentPage === totalPages - 1) ? Math.min(width, height) / 45 : Math.min(width, height) / 100;
                    let beat = Math.sin(time * 5) * 0.05 + 1;
                    
                    target.tParam += 0.02;
                    tx = 16 * Math.pow(Math.sin(target.tParam), 3);
                    ty = -(13 * Math.cos(target.tParam) - 5 * Math.cos(2*target.tParam) - 2 * Math.cos(3*target.tParam) - Math.cos(4*target.tParam));
                    
                    finalX = width / 2 + (tx * scale * beat);
                    finalY = height / 2 + (ty * scale * beat);

                } else if (animationState === 'rose') {
                    // ROTACIÓN 3D FLUIDA PARA LA ROSA
                    let scale = Math.min(width, height) / 25;
                    let rotY = time * 0.6; // Velocidad de giro en 3D
                    let rotX = 0.4;        // Inclinación fija para apreciar el volumen

                    // Matrices de rotación 3D
                    let x1 = tx * Math.cos(rotY) - tz * Math.sin(rotY);
                    let z1 = tx * Math.sin(rotY) + tz * Math.cos(rotY);
                    
                    let y2 = ty * Math.cos(rotX) - z1 * Math.sin(rotX);
                    let z2 = ty * Math.sin(rotX) + z1 * Math.cos(rotX);

                    let fov = 350;
                    let proj = fov / (fov + z2);

                    finalX = width / 2 + (x1 * scale * proj);
                    finalY = height / 2 + (y2 * scale * proj);

                } else if (animationState === 'bird') {
                    // AVE ESTática Y ELEGANTE
                    let scale = Math.min(width, height) / 35;
                    finalX = width / 2 + (tx * scale);
                    finalY = height / 2 + (ty * scale) - 20;
                }

                // Interpolación suave (LERP) hacia la figura
                this.x += (finalX - this.x) * 0.08;
                this.y += (finalY - this.y) * 0.08;

                ctx.fillStyle = target.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Inicialización
        resize();
        for (let i = 0; i < numParticles; i++) particles.push(new Particle(i));

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; // Estela suave
            ctx.fillRect(0, 0, width, height);
            
            particles.forEach(p => p.updateAndDraw());
            time += 0.02;
            requestAnimationFrame(animate);
        }
        animate();

        // ==========================================
        // CONTROL DE NAVEGACIÓN ENTRE PÁGINAS
        // ==========================================
        const pages = document.querySelectorAll('.page');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const counter = document.getElementById('page-counter');
        
        let currentPage = 0;
        const totalPages = pages.length;

        function updatePages() {
            pages.forEach((page, index) => {
                if (index === currentPage) page.classList.add('active');
                else page.classList.remove('active');
            });

            // Asignar animaciones del fondo según el número de página solicitado
            if (currentPage >= 3 && currentPage <= 5) {
                animationState = 'rose';
            } else if (currentPage >= 6 && currentPage <= 8) {
                animationState = 'bird';
            } else {
                animationState = 'heart';
            }

            btnPrev.disabled = currentPage === 0;
            btnNext.style.display = currentPage === totalPages - 1 ? 'none' : 'block';
            
            if (currentPage === 0) counter.innerText = "Inicio";
            else if (currentPage === totalPages - 1) counter.innerText = "Fin";
            else counter.innerText = `${currentPage} de 10`;
        }

        btnNext.addEventListener('click', () => { if (currentPage < totalPages - 1) { currentPage++; updatePages(); } });
        btnPrev.addEventListener('click', () => { if (currentPage > 0) { currentPage--; updatePages(); } });
        updatePages();
    </script>
</body>
</html>
