<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti... 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            /* Fondo con gradiente animado */
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ffc3a0, #ffafbd);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Partículas de fondo (Corazones y Flores) */
        .particle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }

        /* Corazón interactivo al hacer click */
        .click-heart {
            position: absolute;
            font-size: 25px;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1.5); opacity: 0; }
        }

        /* Contenedor tipo Cristal (Glassmorphism) */
        .book-container {
            position: relative;
            width: 90%;
            max-width: 420px;
            height: 550px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Decoraciones fijas en las esquinas */
        .corner-deco {
            position: absolute;
            width: 80px;
            opacity: 0.6;
            pointer-events: none;
        }
        .top-left { top: -10px; left: -10px; transform: rotate(-45deg); font-size: 60px; }
        .bottom-right { bottom: -10px; right: -10px; transform: rotate(135deg); font-size: 60px; }

        /* Páginas con animación 3D */
        .page {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 80px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: rotateY(-30deg) scale(0.8) translateX(50px);
            transition: all 0.7s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
        }

        .page.active {
            opacity: 1;
            transform: rotateY(0deg) scale(1) translateX(0);
            pointer-events: all;
        }

        .page.previous {
            transform: rotateY(30deg) scale(0.8) translateX(-50px);
            opacity: 0;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff3366;
            font-size: 45px;
            margin-bottom: 20px;
            line-height: 1.1;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }

        p {
            color: #444;
            font-size: 18px;
            line-height: 1.7;
            font-weight: 600;
        }

        .reason-number {
            font-family: 'Dancing Script', cursive;
            font-size: 120px;
            background: linear-gradient(45deg, #ff3366, #ff99ac);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.2;
            position: absolute;
            z-index: -1;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Barra inferior (Controles) */
        .controls {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: rgba(255, 255, 255, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-sizing: border-box;
        }

        button {
            background: linear-gradient(45deg, #ff3366, #ff6b8b);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 51, 102, 0.5);
        }

        button:disabled {
            background: #d3d3d3;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            color: #888;
        }

        /* Efecto final de latido */
        .heart-beat {
            font-size: 80px;
            animation: beat 1s infinite alternate;
            filter: drop-shadow(0 0 15px rgba(255,51,102,0.6));
        }

        @keyframes beat {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="corner-deco top-left">🌸</div>
        <div class="corner-deco bottom-right">✨</div>

        <div id="pages-container"></div>

        <div class="controls">
            <button id="btn-prev" disabled>🤍 Atrás</button>
            <span id="page-counter" style="color: #ff3366; font-weight: bold; font-size: 14px;"></span>
            <button id="btn-next">Sig. 💖</button>
        </div>
    </div>

    <script>
        // ==========================================
        // SISTEMA DE PARTÍCULAS (LLUVIA DE FLORES Y CORAZONES)
        // ==========================================
        const emojis = ['🌸', '💖', '✨', '💕', '🌺'];
        for(let i = 0; i < 35; i++) {
            let particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.fontSize = (Math.random() * 15 + 10) + 'px';
            particle.style.animationDuration = (Math.random() * 6 + 4) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(particle);
        }

        // ==========================================
        // MAGIA AL HACER CLIC EN LA PANTALLA
        // ==========================================
        document.addEventListener('click', (e) => {
            let clickHeart = document.createElement('div');
            clickHeart.className = 'click-heart';
            clickHeart.innerHTML = '💖';
            clickHeart.style.left = e.pageX + 'px';
            clickHeart.style.top = e.pageY + 'px';
            document.body.appendChild(clickHeart);
            setTimeout(() => clickHeart.remove(), 1000);
        });

        // ==========================================
        // AQUÍ PUEDES EDITAR TUS 10 RAZONES
        // ==========================================
        const razones = [
            "Tu sonrisa tiene el poder de iluminar hasta mi día más gris.",
            "La forma tan linda en la que te apasionas por las cosas que te gustan.",
            "Tu sentido del humor y cómo siempre logras hacerme reír.",
            "Lo inteligente y brillante que eres en todo lo que haces.",
            "Esa mirada especial que tienes y que me deja sin palabras.",
            "Tu infinita bondad y la forma tan dulce en la que tratas a los demás.",
            "Las conversaciones de horas que se sienten como si fueran minutos.",
            "La paz y seguridad que me haces sentir cuando estoy contigo.",
            "Ese pequeño detalle tuyo de [escribe aquí un detalle muy suyo].",
            "Simplemente porque eres tú, y me he dado cuenta de que me encantas."
        ];
        // ==========================================

        const container = document.getElementById('pages-container');
        let paginasHTML = [];

        // Portada
        paginasHTML.push(`
            <div class="page active">
                <h1>Para ti...</h1>
                <p>He estado pensando mucho últimamente, y quería hacer algo realmente especial.</p>
                <p>Desliza para descubrir <br><span style="color:#ff3366">10 razones por las que me encantas.</span></p>
            </div>
        `);

        // Generar las 10 razones
        razones.forEach((razon, index) => {
            paginasHTML.push(`
                <div class="page">
                    <div class="reason-number">${index + 1}</div>
                    <h1>Razón #${index + 1}</h1>
                    <p>${razon}</p>
                </div>
            `);
        });

        // Página Final
        paginasHTML.push(`
            <div class="page">
                <div class="heart-beat">💝</div>
                <h1>¿Y bien?</h1>
                <p>Estas son solo 10, pero mi lista es infinita.</p>
                <p>Me gustas muchísimo. ¿Te gustaría que saliéramos uno de estos días?</p>
            </div>
        `);

        container.innerHTML = paginasHTML.join('');

        // Lógica de navegación con animaciones
        const pages = document.querySelectorAll('.page');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const counter = document.getElementById('page-counter');
        
        let currentPage = 0;
        const totalPages = pages.length;

        function updatePages() {
            pages.forEach((page, index) => {
                page.classList.remove('active', 'previous');
                if (index === currentPage) {
                    page.classList.add('active');
                } else if (index < currentPage) {
                    page.classList.add('previous');
                }
            });

            btnPrev.disabled = currentPage === 0;
            
            if (currentPage === totalPages - 1) {
                btnNext.style.display = 'none'; 
            } else {
                btnNext.style.display = 'block';
            }

            if (currentPage === 0) {
                counter.innerText = "Inicio";
            } else if (currentPage === totalPages - 1) {
                counter.innerText = "Fin";
            } else {
                counter.innerText = `${currentPage} de 10`;
            }
        }

        btnNext.addEventListener('click', () => {
            if (currentPage < totalPages - 1) {
                currentPage++;
                updatePages();
            }
        });

        btnPrev.addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                updatePages();
            }
        });

        updatePages();
    </script>
</body>
</html>
